<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superpeppe - Archivio Software e Programmi su OneDrive</title>
    <meta name="description" content="Superpeppe: raccolta personale e download diretto dei migliori programmi, utility e software di sviluppo da OneDrive.">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --card-hover: #f8fafc;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --locked: #d97706;
            --locked-hover: #b45309;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 1.5rem 1rem 3rem;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 0.65rem 1.25rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
            font-size: 0.88rem;
            color: var(--text-muted);
            gap: 1rem;
        }

        .top-bar strong {
            color: var(--text-main);
        }

        .status-group {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        header {
            text-align: center;
            margin-bottom: 2.2rem;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #1d4ed8, #0ea5e9);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.4rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Layout fluido come il primo modello: ricerca + tab affiancati */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .search-box {
            flex: 1;
            min-width: 260px;
            padding: 0.75rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            box-shadow: var(--shadow);
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--primary);
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.65rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        .filter-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow);
            transition: transform 0.2s, background-color 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.65rem;
            border-radius: 999px;
            background-color: #eff6ff;
            color: var(--primary);
            font-weight: 700;
            border: 1px solid #bfdbfe;
        }

        .badge.locked-badge {
            background-color: #fef3c7;
            color: var(--locked);
            border-color: #fde68a;
        }

        .version {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .download-btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .download-btn:hover {
            background-color: var(--primary-hover);
        }

        .download-btn.btn-locked {
            background-color: var(--locked);
        }

        .download-btn.btn-locked:hover {
            background-color: var(--locked-hover);
        }

        /* Finestra Password */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 14px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .modal-box h3 {
            margin-bottom: 0.5rem;
            font-size: 1.25rem;
        }

        .modal-box p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
        }

        .modal-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 0.75rem;
            outline: none;
        }

        .modal-input:focus {
            border-color: var(--primary);
        }

        .error-msg {
            color: #dc2626;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn-cancel {
            flex: 1;
            padding: 0.7rem;
            border: 1px solid var(--border);
            background: #f8fafc;
            color: var(--text-main);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-confirm {
            flex: 1;
            padding: 0.7rem;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="status-group">
            <span>📅 <strong id="currentDate">--/--/----</strong></span>
            <span>🕒 <strong id="currentTime">--:--:--</strong></span>
        </div>
        <div>
            👁️ Visite: <strong id="visitCounter">1</strong>
        </div>
    </div>

    <header>
        <h1>Superpeppe</h1>
        <p>Il mio archivio personale di software e utility su OneDrive</p>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="Cerca un programma per nome o descrizione...">
        <div class="filter-buttons" id="categoryFilters"></div>
    </div>

    <div class="grid" id="softwareGrid"></div>

    <footer>
        Superpeppe Software Hub &bull; Tutti i file sono ospitati su OneDrive
    </footer>
</div>

<div class="modal-overlay" id="passwordModal">
    <div class="modal-box">
        <h3>🔒 Area Protetta</h3>
        <p id="modalDesc">Inserisci la password per scaricare questo file.</p>
        <input type="password" id="passwordInput" class="modal-input" placeholder="Password...">
        <div class="error-msg" id="passwordError">Password errata. Riprova!</div>
        <div class="modal-actions">
