<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Monitor Obbligazioni Live</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f9; color: #333; max-width: 1000px; margin-inline: auto; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
h1 { color: #1a365d; margin: 0; font-size: 1.4rem; }
button { background: #1a365d; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
.btn-add { background: #15803d; }
.btn-del { background: #dc2626; padding: 5px 10px; font-size: 0.8rem; }
.box { background: #fff; padding: 15px; border-radius: 6px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
.add-bar { display: flex; gap: 10px; flex-wrap: wrap; }
select, input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
input { flex: 1; }
table { width: 100%; border-collapse: collapse; background: #fff; }
th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
th { background: #1a365d; color: #fff; }
</style>
</head>
<body>

<div class="header">
<h1>Monitor Obbligazioni, BOT e Titoli Esteri</h1>
<button id="btn-aggiorna">Aggiorna Quotazioni</button>
</div>

<div id="stato" style="color:#15803d; font-weight:bold; margin-bottom:15px;">Avvio sistema...</div>

<div class="box add-bar">
<select id="tipo">
<option value="BOT">BOT</option>
<option value="BTP">BTP</option>
<option value="Estero">Estero</option>
</select>
<input type="text" id="nome" placeholder="Nome (es. BTP 2034)">
<input type="text" id="isin" placeholder="Codice ISIN (12 caratteri)" maxlength="12">
<button class="btn-add" id="btn-aggiungi">+ Aggiungi</button>
</div>

<div class="box">
<table>
<thead>
<tr>
<th>Tipo</th>
<th>Titolo</th>
<th>ISIN</th>
<th>Ultimo Prezzo</th>
<th>Rendimento Netto</th>
<th>Azioni</th>
</tr>
</thead>
<tbody id="tabella"></tbody>
</table>
</div>

<script>
const defaultData = [
  { tipo: "BOT", nome: "BOT ZC Ott 2027", isin: "IT0005600001" },
  { tipo: "BTP", nome: "BTP Tf 3,85% Lg34", isin: "IT0005584856" },
  { tipo: "BTP", nome: "BTP Tf 4,15% Ot39", isin: "IT0005582421" },
  { tipo: "Estero", nome: "Bund Germania 2,50%", isin: "DE000BU2Z023" },
  { tipo: "Estero", nome: "OAT Francia 3,00%", isin: "FR001400QMF9" }
];

let lista = JSON.parse(localStorage.getItem("titoli_gh_v1")) || defaultData;

function salva() {
  localStorage.setItem("titoli_gh_v1", JSON.stringify(lista));
}

function getUrl(t) {
  let path = "btp";
  if (t.tipo === "BOT") path = "bot";
  if (t.tipo === "Estero") path = "euro-obbligazioni";
  return "https://borsaitaliana.it" + path + "/scheda/" + t.isin + ".html?lang=it";
}

function caricaTabella() {
  const tbody = document.getElementById("tabella");
  const stato = document.getElementById("stato");
  tbody.innerHTML = "";
  stato.innerText = "Connessione alla rete in corso...";

  lista.forEach((t, index) => {
    const tr = document.createElement("tr");
    const link = getUrl(t);
    tr.innerHTML = "<td><b>" + t.tipo + "</b></td>" +
                   "<td><a href='" + link + "' target='_blank'>" + t.nome + "</a></td>" +
                   "<td>" + t.isin + "</td>" +
                   "<td id='pr-" + index + "'>Caricamento...</td>" +
                   "<td id='rn-" + index + "'>Caricamento...</td>" +
                   "<td><button class='btn-del' data-idx='" + index + "'>Elimina</button></td>";
    tbody.appendChild(tr);

    const proxy = "https://allorigins.win" + encodeURIComponent(link);
    fetch(proxy)
      .then(r => r.json())
      .then(d => {
        const doc = new DOMParser().parseFromString(d.contents, "text/html");
        const pEl = doc.querySelector(".summary-value, .-value");
        const prezzo = pEl ? pEl.textContent.trim() : "Vedi scheda";
        let rend = "Vedi scheda";
        doc.querySelectorAll("tr").forEach(row => {
          if (row.textContent.toLowerCase().includes("rendimento effettivo a scadenza netto")) {
            const tds = row.querySelectorAll("td");
            if (tds.length > 1) rend = tds[1].textContent.trim();
          }
        });
        document.getElementById("pr-" + index).innerText = prezzo;
        document.getElementById("rn-" + index).innerText = rend;
        stato.innerText = "Aggiornato alle " + new Date().toLocaleTimeString("it-IT");
      })
      .catch(() => {
        document.getElementById("pr-" + index).innerHTML = "<a href='" + link + "' target='_blank'>Apri Borsa</a>";
        document.getElementById("rn-" + index).innerText = "-";
      });
  });
}

document.getElementById("btn-aggiungi").addEventListener("click", () => {
  const tipo = document.getElementById("tipo").value;
  const nome = document.getElementById("nome").value.trim();
  const isin = document.getElementById("isin").value.trim().toUpperCase();
  if (!nome || isin.length !== 12) {
    alert("Inserisci nome e ISIN di 12 caratteri");
    return;
  }
  lista.push({ tipo, nome, isin });
  salva();
  document.getElementById("nome").value = "";
  document.getElementById("isin").value = "";
  caricaTabella();
});

document.getElementById("tabella").addEventListener("click", (e) => {
  if (e.target.classList.contains("btn-del")) {
    const idx = e.target.getAttribute("data-idx");
    lista.splice(idx, 1);
    salva();
    caricaTabella();
  }
});

document.getElementById("btn-aggiorna").addEventListener("click", caricaTabella);

caricaTabella();
</script>
</body>
</html>
